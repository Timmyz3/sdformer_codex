experiment: ntx10_v3_lam0.2_s360
data:
  path: ../../data/Datasets/DSEC/saved_flow_data
  preprocessed: true
  num_frames: 10
  num_chunks: 1
  step_mode: m
  spike_th: null
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 9
  - 9
  pretrained_window_size:
  - 0
  - 0
  - 0
  mlp_ratio: 4
spiking_neuron:
  num_steps: 10
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN
atlif_ternary_psn:
  enabled: true
  target: qk
  stage_selection: all
  output_mode: ternary
  threshold_mode: symmetric_bsa_tsn
  center_mode: bias
  max_threshold: 2.0
  min_threshold: 0.001
  negative_threshold_scale: 1.0
  target_rate: null
  target_rate_eta: 0.0
  activity_eta: 0.0
  threshold_eta: 0.00065
  threshold_base_lr: 3.0e-06
  threshold_lr_scale: 50000.0
  threshold_init: 1.0
  trainable: all
  log_interval_steps: 20
  target_groups:
  - name: s0_ffn
    output_mode: binary
    threshold_mode: official_atlif
    center_mode: zero
    threshold_eta: 8.0e-05
    threshold_lr_scale: 8000
    max_threshold: null
    target_rate: null
    activity_eta: 2.0
    paths:
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.0.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.0.mlp.sn2
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.1.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.1.mlp.sn2
  - name: s2_half
    output_mode: binary
    threshold_mode: official_atlif
    center_mode: zero
    threshold_eta: 8.0e-05
    threshold_lr_scale: 6000
    max_threshold: null
    target_rate: null
    activity_eta: 2.0
    paths:
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.0.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.0.mlp.sn2
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.2.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.2.mlp.sn2
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.4.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.2.swin_blocks.4.mlp.sn2
bsa_attention:
  enabled: true
  mode: ternary_alpha_xnor_local_shiftmax
  center_scores: true
  preserve_mean: true
  alpha0: 0.02
  mismatch_penalty: 0.25
  score_scale: 1.0
  consensus_bias: 0.02
  consensus_score_norm: head_dim
  eps: 1.0e-06
  relu_k_floor: 0.0
  value_mode: threshold
  stage_selection: all
  target_blocks:
  - '2:0'
  - '2:1'
  - '2:2'
  - '2:3'
  - '2:4'
  - '2:5'
  single_active_penalty: 0.05
  single_active_penalty_grad: ste
  single_active_ste_slope: 4.0
  single_active_ste_margin: 0.25
  bipolar_mu: 0.0
  bipolar_lambda: 0.5
  bipolar_gate_min: -1.0
  bipolar_gate_max: 1.8
  local_lambda: 0.2
experimental_neuron:
  enabled: false
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false
  use_angular_loss: false
optimizer:
  name: AdamW
  lr: 2.0e-05
  wd: 0.001
  scheduler: multistep
  milestones:
  - 22
  - 27
  use_amp: true
  num_acc: 1
  param_groups:
    enabled: true
    backbone_lr: 1.0e-06
    neuron_lr: 3.0e-05
    norm_lr: 1.0e-06
    norm_wd: 0.0
    threshold_lr: 5.0e-06
    threshold_wd: 0.0
  lr_warmup:
    enabled: true
    steps: 200
    start_factor: 0.1
loader:
  n_epochs: 1
  batch_size: 8
  batch_multiplyer: 1
  resolution:
  - 480
  - 640
  augment:
  - Horizontal
  - Vertical
  - Polarity
  augment_prob:
  - 0.5
  - 0.5
  - 0.0
  max_drop_rate: 0.6
  polarity: true
  crop:
  - 288
  - 384
  gpu: 0
  n_workers: 8
  parallel: false
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  non_blocking: true
metrics:
  name:
  - AEE
  - AAE
  flow_scaling: 1
  mask_events: false
test:
  sample: 825
  n_valid: 1
  scale_factor: 1
vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false
runtime:
  allow_tf32: true
  cudnn_benchmark: true
  snn_backend: cupy
  max_train_steps: 360
  skip_state_save: true
  force_save_epochs:
  - 0
  use_mlflow_model_logging: false
note: 'NTX-10: H49 + local spatial neighbor interaction (local_lambda=0.2)'
