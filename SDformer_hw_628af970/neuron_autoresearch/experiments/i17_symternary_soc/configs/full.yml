experiment: I17_symtern_soc
note: S1+S5 symmetric ternary Q/K (neg_thre=thre, out=±thre) + fixed SOC attention + angular loss. Tuned for doubled total firing from negative recovery.
runtime:
  snn_backend: torch
  cudnn_benchmark: true
  allow_tf32: true
  max_train_steps: 0
  skip_state_save: true
data:
  path: ../../data/Datasets/DSEC/saved_flow_data
  preprocessed: true
  num_frames: 10
  num_chunks: 1
  step_mode: m
  spike_th: null
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations: [relu, null]
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc: [swinv1, MS_PED_Spiking_PatchEmbed_Conv_sfn]
  state_combination: none
  base_num_channels: 96
  swin_depths: [2, 2, 6, 2]
  swin_num_heads: [3, 6, 12, 24]
  swin_out_indices: [0, 1, 2, 3]
  swin_patch_size: [1, 1, 2, 2]
  window_size: [2, 9, 9]
  pretrained_window_size: [0, 0, 0]
  mlp_ratio: 4
spiking_neuron:
  num_steps: 10
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN

# H9a compat_qk_product attention
bsa_attention:
  enabled: true
  stage_selection: all
  center_scores: true
  preserve_mean: true
  eps: 1.0e-06

# S1+S5: symmetric ternary (patches ATLIFTernaryPSN forward)
symmetric_ternary:
  enabled: true

# ATLIF params tuned for doubled total firing from negative branch recovery:
# activity_eta: 3.0 (was 2.0) — stronger sparsity pressure to compensate
# max_threshold: 0.16 (was 0.13) — more headroom for threshold to grow
# negative_threshold_scale: 1.0 — irrelevant with S1 but kept for backward compat
atlif_ternary_psn:
  enabled: true
  target: qk
  stage_selection: all
  output_mode: ternary
  threshold_init: 0.1
  threshold_eta: 0.001
  threshold_lr_scale: 50000.0
  min_threshold: 0.005
  max_threshold: 0.16
  negative_threshold_scale: 1.0
  activity_eta: 3.0
  trainable: all
  log_interval_steps: 20
  target_groups:
  - name: stage0_ffn_binary
    output_mode: binary
    threshold_eta: 8.0e-05
    threshold_lr_scale: 8000.0
    max_threshold: 0.105
    activity_eta: 0.03
    paths:
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.0.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.0.mlp.sn2
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.1.mlp.sn1
    - sttmultires_unet.encoders.swin3d.layers.0.swin_blocks.1.mlp.sn2
  - name: downsample_stage0_stage2_binary
    output_mode: binary
    threshold_eta: 8.0e-05
    threshold_lr_scale: 6000.0
    max_threshold: 0.105
    activity_eta: 0.02
    paths:
    - sttmultires_unet.encoders.swin3d.layers.0.downsample.sn
    - sttmultires_unet.encoders.swin3d.layers.2.downsample.sn

loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0.3
  use_angular_loss: true
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false

optimizer:
  name: AdamW
  lr: 2.0e-05
  wd: 0.001
  scheduler: multistep
  milestones: [20, 25]
  use_amp: true
  num_acc: 1

loader:
  n_epochs: 30
  batch_size: 8
  batch_multiplyer: 1
  resolution: [480, 640]
  augment: [Horizontal, Vertical, Polarity]
  augment_prob: [0.5, 0.5, 0.0]
  max_drop_rate: 0.6
  polarity: true
  crop: [288, 384]
  gpu: 0
  n_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  non_blocking: true
  pin_memory: false
  parallel: false

vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false

metrics:
  name: [AEE]
  flow_scaling: 1
  mask_events: false

test:
  sample: 10
  n_valid: 1

experimental_neuron:
  enabled: false
