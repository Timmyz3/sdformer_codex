experiment: sdformer_baseline_mdr_mvsec_route_fast
data:
  path: data/Datasets/MDR
  preprocessed: false
  num_frames: 10
  num_chunks: 2
  step_mode: m
  spike_th: null
  valid_sequence: "0.09_0.24"
  test_sequence: indoor_flying3
  event_interval: dt1
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 8
  - 8
  pretrained_window_size:
  - 0
  - 0
  - 0
  mlp_ratio: 4
spiking_neuron:
  num_steps: 5
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false
optimizer:
  name: AdamW
  lr: 0.001
  wd: 0.01
  scheduler: multistep
  milestones:
  - 10
  - 20
  - 30
  - 40
  - 50
  - 70
  - 90
  - 120
  use_amp: true
  num_acc: 1
loader:
  n_epochs: 50
  batch_size: 32
  batch_multiplyer: 1
  resolution:
  - 260
  - 346
  augment:
  - Horizontal
  - Vertical
  - Polarity
  augment_prob:
  - 0.5
  - 0.5
  - 0.0
  min_scale: -0.1
  max_scale: 1.0
  polarity: true
  scale_factor: 1
  crop:
  - 256
  - 256
  gpu: 0
  n_workers: 8
  parallel: false
metrics:
  name:
  - AEE
  flow_scaling: 1
  mask_events: false
test:
  scale_factor: 1
  sample: 80
  n_valid: 5
vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false
runtime:
  snn_backend: torch
