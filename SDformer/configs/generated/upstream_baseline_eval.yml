# Minimal eval config - inherits data path and model from training

data:
    path: /root/private_data/work/sdformer_codex/SDformer/data/Datasets/DSEC/saved_flow_data
    preprocessed: True
    num_frames: 10
    num_chunks: 1
    step_mode: 'm'
    spike_th: null

model:
    name: MS_SpikingformerFlowNet_en4
    encoding: voxel
    norm_input: "minmax"
    num_bins: 10
    base_num_channels: 96
    kernel_size: 3
    activations: [relu, null]
    final_activation: null
    mask_output: True
    norm: null
    use_upsample_conv: False

swin_transformer:
    use_arc: ["swinv1", "MS_PED_Spiking_PatchEmbed_Conv_sfn"]
    state_combination: "none"
    base_num_channels: 96
    swin_depths: [2, 2, 6, 2]
    swin_num_heads: [3, 6, 12, 24]
    swin_out_indices: [0, 1, 2, 3]
    swin_patch_size: [1, 1, 2, 2]
    window_size: [2, 9, 9]
    pretrained_window_size: [0, 0, 0]
    mlp_ratio: 4

spiking_neuron:
    num_steps: 10
    v_th: 0.1
    v_reset: null
    neuron_type: psn
    surrogate_fun: surrogate.ATan()
    tau: 2.
    detach_reset: True
    spike_norm: "BN"

loader:
    batch_size: 1
    resolution: [480, 640]
    crop: [288, 384]
    gpu: 0
    n_workers: 4
    polarity: True

metrics:
    name: [AEE, AAE]
    flow_scaling: 1
    mask_events: False

test:
    scale_factor: 1

vis:
    enabled: False

loss:
    lambda_mod: 1
    lambda_ang: 0
    gamma: null
    clip_grad: 100.0

optimizer:
    name: AdamW
    lr: 0.0001
    wd: 0.01

runtime:
    snn_backend: cupy
