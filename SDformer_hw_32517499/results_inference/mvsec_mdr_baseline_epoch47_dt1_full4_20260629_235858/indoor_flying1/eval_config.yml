experiment: eval_mvsec_dt1_mdr_baseline_route
data:
  path: data/Datasets/MVSEC
  test_sequence: indoor_flying1
  event_interval: dt1
  num_frames: 10
  num_chunks: 2
  step_mode: m
  spike_th: null
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 8
  - 8
  pretrained_window_size:
  - 0
  - 0
  - 0
  mlp_ratio: 4
spiking_neuron:
  num_steps: 5
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN
atlif_ternary_psn:
  enabled: false
bsa_attention:
  enabled: false
experimental_neuron:
  enabled: false
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false
loader:
  batch_size: 1
  resolution:
  - 260
  - 346
  crop:
  - 256
  - 256
  polarity: true
  gpu: 0
metrics:
  name:
  - AEE
  flow_scaling: 1
  mask_events: true
test:
  scale_factor: 1
  sample: 10
vis:
  verbose: false
  enabled: false
  px: 400
  store: false
  store_att: false
runtime:
  snn_backend: torch
