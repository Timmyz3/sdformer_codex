status: exploratory_not_signoff
clock:
  port: clk_core
  default_period_ns: 3.0
  override_environment: CLOCK_PERIOD_NS
  setup_uncertainty_ns: 0.2
  hold_uncertainty_ns: 0.05
interface:
  input_delay_ns: 0.25
  output_delay_ns: 0.25
  input_transition_ns: 0.1
  output_load_library_units: 0.01
limits:
  max_fanout: 32
designs:
  h67_fixed2s_mssb5_dc_top:
    boundary: Motion_T450_attention_row_slice
    quotient_enable: false
    mssb5_score_front: true
  h67_rqtb2s_mssb5_dc_top:
    boundary: Motion_T450_attention_row_slice
    quotient_enable: true
    mssb5_score_front: true
  local5_unified_out2_dc_top:
    boundary: Local5_T450_OUT_DIM2_score_to_Acc32_tile
    qsilent: true
    identk: true
    overlap: true
    retirement_mode: closed_form_FCSR
    retirement_implementation: manual_cross_r1_mode0
    topology_compiler_role: contract_verification_only_default_off
    projection_backend: TCFM5
missing_signoff_inputs:
  - target_process_PVT_and_operating_condition
  - characterized_SRAM_or_RF_macros
  - extracted_SPEF_after_place_and_route
  - representative_real_trace_SAIF_and_hierarchy_mapping
  - DFT_UPF_clock_tree_and_physical_constraints
admission_contracts:
  postroute_spef_requires_matching_explicit_netlist: true
  pt_requires_operating_condition_and_corner_role: true
  ptpx_requires_saif_manifest: true
  default_min_saif_annotation_coverage_pct: 95.0
  paper_ppa_requires_macro_dbs_and_expected_references: true
