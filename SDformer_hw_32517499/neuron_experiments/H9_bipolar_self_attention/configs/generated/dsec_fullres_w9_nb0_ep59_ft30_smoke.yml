  preprocessed: true
  num_frames: 10
  num_chunks: 1
  step_mode: m
  spike_th: null
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 9
  - 9
  pretrained_window_size:
  - 0
  - 0
  - 0
  mlp_ratio: 4
spiking_neuron:
  num_steps: 10
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false
optimizer:
  name: AdamW
  lr: 0.0001
  wd: 0.01
  scheduler: multistep
  milestones:
  - 10
  - 20
  - 30
  - 40
  - 50
  - 70
  - 90
  - 120
  use_amp: true
  num_acc: 4
loader:
  n_epochs: 1
  batch_size: 2
  batch_multiplyer: 1
  resolution:
  - 480
  - 640
  augment:
  - Horizontal
  - Vertical
  - Polarity
  augment_prob:
  - 0.5
  - 0.5
  - 0.0
  max_drop_rate: 0.6
  polarity: true
  crop: null
  gpu: 0
  n_workers: 8
  parallel: false
  persistent_workers: true
  pin_memory: false
  prefetch_factor: 2
  non_blocking: true
  remap: v1
metrics:
  name:
  - AEE
  - AAE
  - AAE_Benchmark
  flow_scaling: 1
  mask_events: false
test:
  sample: 1
  n_valid: 1
  scale_factor: 1
vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false
runtime:
  allow_tf32: true
  cudnn_benchmark: true
  snn_backend: cupy
  seed: 0
  max_train_steps: 2
  skip_save: true
  skip_state_save: true
  save_only_force_epochs: true
  force_save_epochs: []
  state_save_epochs: []
  use_mlflow_model_logging: false
  full_resolution_protocol: 480x640_window9_hardware_consistent
  effective_batch: 8
note: DSEC full-resolution fine-tune from NB0 frozen crop checkpoint. Uses 480x640
  with window [2,9,9], remap=v1 audited interpolation, physical batch 2, accumulation
  4, effective batch 8. This is hardware-consistent and must not be labeled as the
  paper window15 protocol.
