experiment: mvsec_cicc_local5_w8_seed0
data:
  path: data/Datasets/MVSEC
  preprocessed: true
  num_frames: 10
  num_chunks: 1
  step_mode: m
  spike_th: null
  valid_sequence: 0.09_0.24
  test_sequence: outdoor_day2
  event_interval: dt1
  training_dataset: mvsec_dt1
  mvsec_split_manifest: neuron_experiments/H9_bipolar_self_attention/manifests/mvsec_cicc_dt1_v1.json
  mvsec_train_split: train
  mvsec_valid_split: validation
  mvsec_source_valid_before_crop: true
  mvsec_direct_augmentation:
    enabled: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 8
  - 8
  pretrained_window_size:
  - 2
  - 8
  - 8
  mlp_ratio: 4
spiking_neuron:
  num_steps: 10
  v_th: 0.1
  v_reset: null
  neuron_type: psn
  surrogate_fun: surrogate.ATan()
  tau: 2.0
  detach_reset: true
  spike_norm: BN
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 100.0
  overwrite_intermediate: false
  use_angular_loss: false
optimizer:
  name: AdamW
  lr: 0.0001
  wd: 0.001
  scheduler: multistep
  milestones:
  - 20
  - 25
  use_amp: true
  num_acc: 1
  param_groups:
    enabled: true
    backbone_lr: 0.0001
    neuron_lr: 5.0e-05
    norm_lr: 0.0001
    norm_wd: 0.0
    threshold_lr: 5.0e-06
    threshold_wd: 0.0
  lr_warmup:
    enabled: false
    steps: 720
    start_factor: 0.05
loader:
  n_epochs: 30
  batch_size: 8
  batch_multiplyer: 1
  resolution:
  - 260
  - 346
  augment:
  - Horizontal
  - Vertical
  - Polarity
  augment_prob:
  - 0.5
  - 0.5
  - 0.0
  min_scale: -0.1
  max_scale: 1.0
  polarity: true
  scale_factor: 1
  crop:
  - 256
  - 256
  gpu: 0
  n_workers: 8
  parallel: false
  validation_batch_size: 1
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false
  drop_last_train: true
  drop_last_valid: false
vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false
metrics:
  name:
  - AEE
  flow_scaling: 1
  mask_events: true
  train_mask_events: false
  valid_mask_events: true
test:
  scale_factor: 1
  sample: 800
  n_valid: 1
runtime:
  snn_backend: cupy
  allow_tf32: true
  cudnn_benchmark: true
  checkpoint_metric: valid_loss
  protocol: cicc_spikeflownet_outdoor_day2_dt1_center256_seed0
  seed: 0
  reproducibility: seeded_data_order_non_bit_exact
  initialization: same_mvsec_nb0_seed0_checkpoint
