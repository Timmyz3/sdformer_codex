note: Paper-geometry DSEC full-resolution fine-tune from NB0. Uses 480x640, window
  [2,15,15], crop=null, 30 additional epochs, physical batch 1 or 2 without gradient
  accumulation, audited remap=v1 bicubic relative-position interpolation, and no-running-stat
  BN evaluation with the released validation batch size 1. This local source checkpoint
  contains 60 crop epochs; the paper's crop training budget is 80 epochs, so that
  source-budget difference must remain disclosed.
