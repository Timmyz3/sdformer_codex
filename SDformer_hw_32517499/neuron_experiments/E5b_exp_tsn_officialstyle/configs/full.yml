experiment: E5b_exp_tsn_officialstyle
data:
  path: ../../data/Datasets/DSEC/saved_flow_data
  preprocessed: true
  num_frames: 10
  num_chunks: 1
  step_mode: m
  spike_th: null
model:
  name: MS_SpikingformerFlowNet_en4
  encoding: voxel
  norm_input: minmax
  num_bins: 10
  base_num_channels: 96
  kernel_size: 3
  activations:
  - relu
  - null
  final_activation: null
  mask_output: true
  norm: null
  use_upsample_conv: false
swin_transformer:
  use_arc:
  - swinv1
  - MS_PED_Spiking_PatchEmbed_Conv_sfn
  state_combination: none
  base_num_channels: 96
  swin_depths:
  - 2
  - 2
  - 6
  - 2
  swin_num_heads:
  - 3
  - 6
  - 12
  - 24
  swin_out_indices:
  - 0
  - 1
  - 2
  - 3
  swin_patch_size:
  - 1
  - 1
  - 2
  - 2
  window_size:
  - 2
  - 9
  - 9
  pretrained_window_size:
  - 0
  - 0
  - 0
  mlp_ratio: 4
spiking_neuron:
  num_steps: 10
  v_th: 1.0
  v_reset: null
  neuron_type: exp_tsn
  surrogate_fun: surrogate.ATan()
  tau: 4.0
  detach_reset: true
  spike_norm: BN
loss:
  training: supervised
  lambda_mod: 1
  lambda_ang: 0
  flow_regul_weight: 0.001
  gamma: null
  clip_grad: 1.0
  overwrite_intermediate: false
optimizer:
  name: SGD
  lr: 0.0005
  momentum: 0.9
  wd: 0.0001
  scheduler: cosine
  eta_min: 0.0
  milestones: []
  official_tsn_split_weights: true
  use_amp: true
  num_acc: 1
loader:
  n_epochs: 60
  batch_size: 4
  batch_multiplyer: 1
  resolution:
  - 480
  - 640
  augment:
  - Horizontal
  - Vertical
  - Polarity
  augment_prob:
  - 0.5
  - 0.5
  - 0.0
  max_drop_rate: 0.6
  polarity: true
  crop:
  - 288
  - 384
  gpu: 0
  n_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  non_blocking: true
  pin_memory: false
  parallel: false
  seed: 0
vis:
  verbose: false
  enabled: false
  px: 400
  store_grads: false
  store: false
  mask_events: false
  store_spike_rates: false
metrics:
  name:
  - AEE
  flow_scaling: 1
  mask_events: false
test:
  sample: 40
  n_valid: 5
runtime:
  snn_backend: torch
  cudnn_benchmark: true
  allow_tf32: true
experimental_neuron:
  enabled: true
